[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poker-arena"
version = "0.1.0"
description = "Agent Town Poker Arena (OpenSpiel tournament operator + traces + leaderboard)"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "python-multipart>=0.0.9",
  "pydantic>=2.7.0",
  "open_spiel==1.5",
  "numpy>=1.26.0",
  "openskill==5.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]

[project.scripts]
poker-arena = "poker_arena.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["poker_arena*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
